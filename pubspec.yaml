name: process_group
description: >-
  Starts a process in a process group of its own, so that killing it ends
  every process it started. A job object does the same on Windows.
version: 0.1.0

environment:
  sdk: ^3.13.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
  zig_hook:
    path: ../zig_hook/dart

zig_hook:
  artifact: executable
  name: process_group_helper
